<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宏達補習班｜課程諮詢表單</title>
    <meta name="description" content="宏達補習班課程諮詢表單。留下聯絡方式後，將由專人電話確認課程需求。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sam0404044.github.io/HongdaMarketing/" />
    <meta property="og:title" content="宏達補習班｜課程諮詢表單" />
    <meta property="og:description" content="留下聯絡方式後，將由專人電話確認課程需求。" />
    <meta property="og:image" content="https://sam0404044.github.io/HongdaMarketing/assets/preview.png" />
    <meta property="og:image:alt" content="宏達補習班課程諮詢表單預覽" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="宏達補習班｜課程諮詢表單" />
    <meta name="twitter:description" content="留下聯絡方式後，將由專人電話確認課程需求。" />
    <meta name="twitter:image" content="https://sam0404044.github.io/HongdaMarketing/assets/preview.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <form class="consult-form" id="consultForm" novalidate>
        <header class="form-header">
          <img src="./assets/study-hero.png" alt="" />
          <div>
            <p>電話諮詢預約</p>
            <h1>宏達補習班課程諮詢表</h1>
            <span>留下聯絡方式後，將由專人電話確認課程需求。</span>
          </div>
        </header>

        <div class="field-grid">
          <label class="field">
            <span>學生姓名 <strong>*</strong></span>
            <input type="text" name="studentName" autocomplete="name" required />
          </label>

          <label class="field">
            <span>聯絡電話 <strong>*</strong></span>
            <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="例如：0912 345 678" required />
          </label>

          <label class="field">
            <span>填寫身分</span>
            <select name="identity">
              <option value="學生本人">學生本人</option>
              <option value="家長">家長</option>
              <option value="其他">其他</option>
            </select>
          </label>

          <label class="field">
            <span>目前年級 <strong>*</strong></span>
            <select name="grade" required>
              <option value="">請選擇</option>
              <option>國一</option>
              <option>國二</option>
              <option>國三</option>
              <option>高一</option>
              <option>高二</option>
              <option>高三</option>
              <option>其他</option>
            </select>
          </label>
        </div>

        <fieldset class="choice-group">
          <legend>想了解的課程或科目 <strong>*</strong></legend>
          <label><input type="checkbox" name="subjects" value="國文" /> 國文</label>
          <label><input type="checkbox" name="subjects" value="英文" /> 英文</label>
          <label><input type="checkbox" name="subjects" value="數學" /> 數學</label>
          <label><input type="checkbox" name="subjects" value="自然" /> 自然</label>
          <label><input type="checkbox" name="subjects" value="社會" /> 社會</label>
          <label><input type="checkbox" name="subjects" value="段考衝刺" /> 段考衝刺</label>
          <label><input type="checkbox" name="subjects" value="升學準備" /> 升學準備</label>
          <label><input type="checkbox" name="subjects" value="重考" /> 重考</label>
        </fieldset>

        <fieldset class="choice-group">
          <legend>方便電話聯絡時段</legend>
          <label><input type="radio" name="callTime" value="平日早上 09:00-12:00" checked /> 平日早上 09:00-12:00</label>
          <label><input type="radio" name="callTime" value="平日下午 13:00-17:00" /> 平日下午 13:00-17:00</label>
          <label><input type="radio" name="callTime" value="平日晚上 18:00-21:00" /> 平日晚上 18:00-21:00</label>
          <label><input type="radio" name="callTime" value="週末 09:00-18:00" /> 週末 09:00-18:00</label>
          <label><input type="radio" name="callTime" value="皆可" /> 皆可</label>
        </fieldset>

        <label class="field full">
          <span>目前想解決的學習問題</span>
          <textarea name="need" rows="4" placeholder="例如：數學段考想加強、想了解國三會考班、英文作文需要補強"></textarea>
        </label>

        <label class="consent">
          <input type="checkbox" name="consent" required />
          <span>我同意宏達補習班以電話或簡訊聯絡我，協助確認課程諮詢需求。</span>
        </label>

        <div class="actions">
          <button class="primary-button" type="submit">送出諮詢資料</button>
        </div>

        <div class="result" id="result" aria-live="polite" hidden></div>
      </form>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
